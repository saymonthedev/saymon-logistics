name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  NODE_VERSION: '20'

jobs:
  api:
    name: API (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saymon
          POSTGRES_PASSWORD: saymon_test_pw
          POSTGRES_DB: saymon_logistics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saymon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://saymon:saymon_test_pw@localhost:5432/saymon_logistics_test?schema=public
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 8h
      COOKIE_NAME: saymon_session
      CORS_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint:api

      - name: Type check
        run: npx tsc -p apps/api/tsconfig.json --noEmit

      - name: Unit tests
        run: npm run test:api

      - name: Apply migrations
        run: npm run prisma:migrate:deploy --workspace=apps/api

      - name: Integration tests
        run: npm run test:api:integration

      - name: Build
        run: npm run build:api

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:web

      - name: Build (includes type checking)
        run: npm run build:web
